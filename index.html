<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sơ Đồ Tổ Chức Nội Bộ</title>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f6; overflow: hidden; }
    
    /* Màn hình đăng nhập */
    #login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .login-box { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 330px; text-align: center; }
    .login-box h2 { margin: 0 0 8px; color: #1e3a8a; font-size: 20px; }
    .login-box p { margin: 0 0 20px; color: #64748b; font-size: 13px; }
    .login-box input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; margin-bottom: 14px; outline: none; text-align: center; letter-spacing: 1px; }
    .login-box input:focus { border-color: #2563eb; }
    .login-box button { width: 100%; padding: 11px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .login-box button:hover { background: #1d4ed8; }
    #login-error { color: #dc2626; font-size: 13px; margin-top: 12px; display: none; font-weight: 500; }

    /* Giao diện chính */
    #header { background: #1e3a8a; color: white; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    #header h2 { margin: 0; font-size: 17px; }
    #welcome-text { font-size: 12px; color: #bfdbfe; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    #search-box { padding: 8px 12px; border-radius: 6px; border: none; width: 240px; font-size: 14px; }
    #logout-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    #logout-btn:hover { background: rgba(255,255,255,0.25); }
    #chart-container { width: 100vw; height: calc(100vh - 56px); }
    
    /* Thẻ nhân viên & ảnh 4x6 */
    .node-card { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 4px solid #2563eb; padding: 10px; display: flex; align-items: center; gap: 12px; height: 100%; box-sizing: border-box; }
    .node-dept { background: #eff6ff; border-top: 4px solid #1d4ed8; justify-content: center; text-align: center; flex-direction: column; }
    .avatar-4x6 { width: 60px; height: 90px; border-radius: 4px; object-fit: cover; object-position: top center; background: #e2e8f0; flex-shrink: 0; border: 1px solid #cbd5e1; }
    .info { text-align: left; overflow: hidden; }
    .name { font-weight: 700; font-size: 13px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role { font-size: 12px; color: #2563eb; font-weight: 600; margin-top: 3px; }
    .id-badge { font-size: 11px; color: #64748b; margin-top: 4px; background: #f1f5f9; display: inline-block; padding: 2px 6px; border-radius: 4px; }
    #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.92); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999; font-weight: 600; color: #1e3a8a; }
  </style>
</head>
<body>

<!-- Màn hình đăng nhập bằng CCCD -->
<div id="login-screen">
  <div class="login-box">
    <h2>SƠ ĐỒ TỔ CHỨC NỘI BỘ</h2>
    <p>Nhập số Căn cước công dân của bạn để truy cập</p>
    <input type="text" id="cccd-input" inputmode="numeric" placeholder="Nhập đủ 12 số CCCD...">
    <button id="login-btn">Xác thực & Xem sơ đồ</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- Màn hình tải dữ liệu -->
<div id="loading">Đang kiểm tra thông tin & tải sơ đồ tổ chức...</div>

<!-- Giao diện sơ đồ -->
<div id="header">
  <div>
    <h2>SƠ ĐỒ TỔ CHỨC NHÂN SỰ</h2>
    <div id="welcome-text"></div>
  </div>
  <div class="header-actions">
    <input type="text" id="search-box" placeholder="Tìm theo tên, Mã NV hoặc chức vụ...">
    <button id="logout-btn">Thoát</button>
  </div>
</div>

<div id="chart-container"></div>

<!-- Đưa thư viện xuống cuối trang để không bao giờ làm treo nút đăng nhập -->
<!-- Thư viện vẽ sơ đồ: D3.js và d3-org-chart -->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3"></script>

<script>
  // DÁN ĐÚNG URL GOOGLE APPS SCRIPT CỦA BẠN VÀO DÒNG DƯỚI ĐÂY
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzCBz8ew2hbcJPY-DgQ72RBP6sPk_PZFYCt4NhHh2j4RdQGZgKnfgv30v_5smX_B026Iw/exec";
  
  let chart = null;
  let aiLoaded = false;

  // Hàm lưu trữ an toàn (chống lỗi Tracking Prevention của trình duyệt)
  const safeStorage = {
    get: function(key) {
      try { return sessionStorage.getItem(key); } catch (e) { return null; }
    },
    set: function(key, val) {
      try { sessionStorage.setItem(key, val); } catch (e) {}
    },
    remove: function(key) {
      try { sessionStorage.removeItem(key); } catch (e) {}
    }
  };

  const ROLE_RANK = {
    'DGD': 1, 'DIRECTOR': 2, 'MANAGER': 3, 'CHIEF': 4, 
    'VICE CHIEF': 5, 'SENIOR OFFICER': 6, 'OFFICER': 7, 'OFFICE STAFF': 8
  };

  function getRank(role) {
    const upper = (role || '').toUpperCase();
    for (let key in ROLE_RANK) {
      if (upper.includes(key)) return ROLE_RANK[key];
    }
    return 99;
  }

  function showError(msg) {
    const errEl = document.getElementById('login-error');
    errEl.innerText = msg;
    errEl.style.display = 'block';
  }

  function handleLogin() {
    const cccd = document.getElementById('cccd-input').value.trim();
    if (!/^\\d{12}$/.test(cccd)) {
      showError("CCCD phải gồm đúng 12 chữ số!");
      return;
    }
    if (GAS_API_URL.includes("THAY_URL_WEB_APP")) {
      showError("Bạn chưa dán đường link Google Apps Script vào file index.html!");
      return;
    }
    document.getElementById('login-error').style.display = 'none';
    loadSystem(cccd);
  }

  // Gán sự kiện trực tiếp bằng JavaScript (không dùng onclick trên HTML)
  document.getElementById('login-btn').addEventListener('click', handleLogin);
  document.getElementById('cccd-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('logout-btn').addEventListener('click', function() {
    safeStorage.remove('org_cccd');
    location.reload();
  });
  document.getElementById('search-box').addEventListener('keyup', function() {
    filterChart(this.value);
  });

  // Tạm không dùng nhận diện khuôn mặt: model URL cũ không hợp lệ.
  // Ảnh nhân viên vẫn hiển thị theo khung 4x6 bằng object-fit: cover.

  function buildHierarchy(employees) {
    const nodes = [{ id: 'COMPANY', parentId: '', name: 'BAN GIÁM ĐỐC / CÔNG TY', type: 'dept' }];
    const addedDepts = new Set();
    const addedSubDepts = new Set();

    employees.sort((a, b) => getRank(a.chucvu) - getRank(b.chucvu));

    employees.forEach(emp => {
      const deptId = 'DEPT_' + emp.phongban;
      if (emp.phongban && !addedDepts.has(deptId)) {
        addedDepts.add(deptId);
        nodes.push({ id: deptId, parentId: 'COMPANY', name: emp.phongban, type: 'dept' });
      }

      let parentForEmp = deptId;
      if (emp.bophan && emp.bophan !== emp.phongban) {
        const subId = deptId + '_SUB_' + emp.bophan;
        if (!addedSubDepts.has(subId)) {
          addedSubDepts.add(subId);
          nodes.push({ id: subId, parentId: deptId, name: emp.bophan, type: 'dept' });
        }
        parentForEmp = subId;
      }

      nodes.push({
        id: emp.manv, parentId: parentForEmp, name: emp.hoten,
        role: emp.chucvu, manv: emp.manv, anh: emp.anh, type: 'emp'
      });
    });
    return nodes;
  }

  async function loadSystem(cccd) {
    document.getElementById('loading').style.display = 'flex';
    try {
      const response = await fetch(`${GAS_API_URL}?cccd=${encodeURIComponent(cccd)}`, {
        method: 'GET',
        redirect: 'follow',
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(`Máy chủ trả về lỗi HTTP ${response.status}`);
      const result = await response.json();

      if (result.error) {
        document.getElementById('loading').style.display = 'none';
        showError(result.error);
        safeStorage.remove('org_cccd');
        return;
      }

      safeStorage.set('org_cccd', cccd);
      document.getElementById('login-screen').style.display = 'none';
document.getElementById('welcome-text').innerText = Xin chào: ${result.user};
if (typeof d3 === 'undefined' || typeof d3.OrgChart === 'undefined') {
  throw new Error("Không tải được thư viện sơ đồ tổ chức. Hãy kiểm tra kết nối tới d3js.org và cdn.jsdelivr.net.");
}
const treeData = buildHierarchy(result.data);
chart = new d3.OrgChart()
.container('#chart-container')
.data(treeData)
.nodeWidth(d => d.data.type === 'dept' ? 220 : 260)
.nodeHeight(d => d.data.type === 'dept' ? 70 : 115)
.childrenMargin(d => 45)
.compactMarginBetween(d => 25)
.nodeContent(d => {
        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
        if (d.data.type === 'dept') {
          return `<div class="node-card node-dept">
            <div class="name" style="font-size:15px;color:#1e3a8a;">${esc(d.data.name)}</div>
            <div class="id-badge">${d.data._totalSubordinates || 0} nhân sự</div>
          </div>`;
        }
        const defaultAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(d.data.name || 'NV')}&background=cbd5e1&color=1e293b&size=150`;
        const imgSrc = d.data.anh || defaultAvatar;
        return `<div class="node-card">
          <img class="avatar-4x6" crossorigin="anonymous" src="${esc(imgSrc)}"
               onerror="this.onerror=null;this.src='${defaultAvatar}'">
          <div class="info">
            <div class="name" title="${esc(d.data.name)}">${esc(d.data.name)}</div>
            <div class="role">${esc(d.data.role)}</div>
            <div class="id-badge">Mã NV: ${esc(d.data.manv)}</div>
          </div>
        </div>`;
      })
      .render();
chart.expandAll().fit();
document.getElementById('loading').style.display = 'none';
} catch (error) {
document.getElementById('loading').style.display = 'none';
showError(error.message || "Lỗi kết nối máy chủ. Vui lòng thử lại!");
}
}
function filterChart(value) {
if (!chart) return;
const data = chart.data();
data.forEach(d => { d._highlighted = false; d._expanded = false; });
if (value.trim() !== '') {
const term = value.toLowerCase();
data.forEach(d => {
if ((d.name && d.name.toLowerCase().includes(term)) ||
(d.manv && d.manv.toLowerCase().includes(term)) ||
(d.role && d.role.toLowerCase().includes(term))) {
d._highlighted = true;
d._expanded = true;
}
});
}
chart.data(data).render().fit();
}
window.addEventListener('load', () => {
const savedCCCD = safeStorage.get('org_cccd');
if (savedCCCD) {
loadSystem(savedCCCD);
}
});
